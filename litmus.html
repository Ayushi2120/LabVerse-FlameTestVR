<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labverse: Litmus Test VR</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #instructions {
        position: absolute;
        top: 50%;
        width: 100%;
        text-align: center;
        color: #ffffff;
        background: rgba(0,0,0,0.5);
        pointer-events: none;
        user-select: none;
      }
      #nav {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 100;
      }
      #nav a {
        color: white;
        background: #333;
        padding: 8px 12px;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      #nav a:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div id="nav">
      <a href="./index.html">← Back to Flame Test</a>
    </div>
    <div id="app"></div>
    <div id="instructions">
      <p>Click to start Desktop Controls (WASD/Mouse).<br/>Or click "ENTER VR" at the bottom.</p>
    </div>
    <script type="module" src="/src/litmus.ts"></script>
  </body>
</html>
